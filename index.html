<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Alışkanlıklarım</title>
<meta name="description" content="Kişisel gelişim ve günlük alışkanlık takibi uygulaması" />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#F8F9FA" />

<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes" />

<!-- iOS / Safari -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Alışkanlıklarım" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

<!-- Icons -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app" class="app-shell">
  <div class="app-frame">
    <main id="screen" class="screen" role="main"></main>
    <nav id="bottom-nav" class="bottom-nav" role="navigation" aria-label="Ana gezinme"></nav>
  </div>
</div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
